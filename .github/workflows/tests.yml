# Regression tests on every push and pull request. Runs the offline Playwright
# harness only: no deploy, no secrets, no production access (the harness mocks
# Supabase, OneSignal and Stripe and fails on any non-localhost request).
name: tests

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macOS: the booth baseline snapshots are -darwin; Linux would need its own.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium webkit

      - name: Node unit tests
        run: npm run test:node

      - name: Playwright (smoke, unit, regression, booth; chromium + webkit)
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
